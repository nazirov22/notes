<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование заметки</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="/css/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <div class="header-content">
            <a href="notes.html" class="btn-custom">Назад к списку</a>
            <h1>Редактирование заметки</h1>
        </div>
    </header>

    <div class="edit-note-container">
        <form id="noteForm">
            <input type="text" id="noteTitle" placeholder="Заголовок" required>
            <textarea id="noteText" placeholder="Текст заметки" required></textarea>
            <select id="noteCategory" required>
                <option value="" disabled selected>Выберите категорию</option>
                <option value="1">Работа</option>
                <option value="2">Учёба</option>
                <option value="3">Личное</option>
            </select>
            <button type="submit">Сохранить</button>
            <button type="button" id="deleteBtn" class="delete-btn">Удалить</button>
        </form>
    </div>

    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> -->
    <script src="/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/edit-note.js"></script>
    <script type="module" src="/js/utils.js"></script>
</body>

</html>
