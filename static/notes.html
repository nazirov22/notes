<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер заметок</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="/css/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <div class="header-content">
            <a href="edit-note.html" class="btn-custom create-btn">Создать новую заметку</a>
            <h1>Менеджер заметок</h1>
            <div class="auth-buttons">
                <a href="login.html" class="btn-custom exit-btn">Выйти</a>
            </div>
        </div>
    </header>

    <div class="notes-app-container">
        <div class="main-container">
            <aside class="notes-aside">
                <h2 class="notes-title">Категории</h2>
                <ul class="categories-list" id="categories">
                    <li data-category="1">Работа</li>
                    <li data-category="2">Учёба</li>
                    <li data-category="3">Личное</li>
                </ul>
            </aside>
            <main class="notes-content">
                <input type="text" id="searchInput" class="notes-search" placeholder="Поиск по заметкам...">
                <div class="notes-list-container">
                    <div id="notesContainer" class="notes-grid"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> -->
    <script src="/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { displayNotes, editNote, deleteNote } from './js/notes.js';
        import { getCookie } from './js/utils.js';

        window.editNote = editNote;
        window.deleteNote = deleteNote;

        document.addEventListener('DOMContentLoaded', function () {
            displayNotes();
        });
    </script>
</body>

</html>
