<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование заметки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <div class="container-fluid">
            <div class="header-content py-2">
                <a href="notes.html" class="btn-custom">Назад к списку</a>
                <h1 class="m-0 text-center">Редактирование заметки</h1>
            </div>
        </div>
    </header>

    <main class="container mt-3">
        <section class="edit-note-container">
            <form id="noteForm">
                <input type="text" id="noteTitle" class="form-control mb-3" placeholder="Название заметки" required>
                <textarea id="noteText" class="form-control mb-3" placeholder="Текст заметки" required
                    rows="5"></textarea>
                <select id="noteCategory" class="form-select mb-3">
                    <option>Работа</option>
                    <option>Учеба</option>
                    <option>Личное</option>
                </select>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn-custom flex-grow-1">Сохранить</button>
                    <button type="button" id="deleteBtn" class="btn-custom delete-btn">Удалить</button>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/edit-note.js"></script>
</body>

</html>
