<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <div class="container-fluid">
            <div class="header-content py-2">
                <h1 class="m-0 text-center"><a href="index.html" class="header-link">Менеджер заметок</a></h1>
            </div>
        </div>
    </header>
    <main class="container mt-5">
        <section class="auth-form mx-auto">
            <h2 class="text-center">Регистрация</h2>
            <form>
                <input type="text" class="form-control mb-3" placeholder="Имя пользователя" required>
                <input type="email" class="form-control mb-3" placeholder="Email" required>
                <input type="password" class="form-control mb-3" placeholder="Пароль" required>
                <button type="submit" class="btn-custom w-100">Зарегистрироваться</button>
            </form>

            <p class="text-center mt-3">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/auth.js"></script>
</body>

</html>
