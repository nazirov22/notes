<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заметки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <div class="container-fluid">
            <div class="header-content py-2">
                <a href="edit-note.html" class="btn-custom create-btn">Создать новую заметку</a>
                <h1 class="m-0 text-center"><a href="index.html" class="header-link">Менеджер заметок</a></h1>
                <a href="index.html" class="btn-custom exit-btn">Выйти</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="container-notes">
            <div class="row g-3">
                <aside class="notes-aside col-lg-3 col-md-4">
                    <h2 class="notes-title">Категории</h2>
                    <ul id="categories" class="categories-list">
                        <li data-category="Работа">Работа</li>
                        <li data-category="Учеба">Учеба</li>
                        <li data-category="Личное">Личное</li>
                    </ul>
                </aside>
                <section class="notes-content col-lg-9 col-md-8">
                    <input type="text" id="searchInput" class="notes-search" placeholder="Поиск заметок...">
                    <div id="notesContainer" class="notes-grid"></div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { displayNotes, editNote, deleteNote } from './js/notes.js';

        window.editNote = editNote;
        window.deleteNote = deleteNote;

        document.addEventListener('DOMContentLoaded', function () {
            displayNotes();
        });
    </script>
</body>

</html>
